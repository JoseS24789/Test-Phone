<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Checker - Craftex</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="./craftex-connector.js" defer></script>
    <style>
        :root {
            --bg: #f4f7f6;
            --card: #ffffff;
            --text: #2c3e50;
            --muted: #64748b;
            --success: #16a34a;
            --error: #dc2626;
            --accent: #0f172a;
            --link: #2563eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            background: var(--bg);
            margin: 0;
            padding: 24px 16px;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .scanner-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 14px;
            letter-spacing: -0.01em;
        }

        #reader {
            width: 100%;
            max-width: 340px;
            background: var(--card);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            min-height: 240px;
        }

        #reader img[alt="Info icon"] {
            display: none;
        }

        #status-box {
            margin-top: 20px;
            padding: 16px 20px;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
            max-width: 400px;
            width: 100%;
            font-size: 0.95rem;
            line-height: 1.45;
        }

        .status-idle { color: var(--muted); font-weight: 500; }
        .status-success { color: var(--success); font-weight: 600; }
        .status-error { color: var(--error); font-weight: 600; }

        .code-badge {
            display: inline-block;
            margin: 6px 0;
            padding: 4px 10px;
            background: #f1f5f9;
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 1rem;
            color: var(--accent);
        }

        .subtext {
            display: block;
            font-size: 0.82rem;
            color: var(--muted);
            font-weight: 400;
            margin-top: 4px;
        }

        .manual-link {
            display: inline-block;
            margin-top: 10px;
            color: var(--link);
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: underline;
            word-break: break-all;
        }

        .manual-link:hover {
            opacity: 0.85;
        }

        .actions {
            margin-top: 12px;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 9px 16px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-action:hover {
            opacity: 0.92;
        }
    </style>
</head>
<body>

    <div class="scanner-title">Price Checker</div>
    <div id="reader"></div>
    <div id="status-box" class="status-idle">Apunta la cámara trasera al código de barras...</div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const statusBox = document.getElementById("status-box");
            const html5QrCode = new Html5Qrcode("reader");
            const connector = window.CraftexConnector;

            let isProcessing = false;

            const config = {
                fps: 15,
                qrbox: { width: 250, height: 120 },
                aspectRatio: 1.333333,
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E,
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.CODE_39,
                    Html5QrcodeSupportedFormats.ITF,
                    Html5QrcodeSupportedFormats.QR_CODE
                ]
            };

            function setStatus(type, htmlContent) {
                statusBox.className = `status-${type}`;
                statusBox.innerHTML = htmlContent;
            }

            function addActionButton(label, onClick) {
                let container = statusBox.querySelector(".actions");
                if (!container) {
                    container = document.createElement("div");
                    container.className = "actions";
                    statusBox.appendChild(container);
                }

                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "btn-action";
                btn.textContent = label;
                btn.addEventListener("click", onClick);
                container.appendChild(btn);
            }

            async function onScanSuccess(decodedText) {
                if (isProcessing) return;
                isProcessing = true;

                const cleanCode = connector ? connector.normalizeCode(decodedText) : decodedText.trim();
                if (!cleanCode) {
                    isProcessing = false;
                    return;
                }

                if (navigator.vibrate) {
                    navigator.vibrate(100);
                }

                try {
                    if (html5QrCode.isScanning) {
                        await html5QrCode.stop();
                    }
                } catch (err) {
                    console.warn("No se pudo detener la cámara:", err);
                }

                const result = connector
                    ? connector.openSearchTab(cleanCode)
                    : { opened: false, url: `https://www.craftex.com/search?keywords=${encodeURIComponent(cleanCode)}` };

                const helperMsg = result.opened
                    ? "Búsqueda abierta en una nueva pestaña."
                    : "El navegador bloqueó la pestaña automática. Usa el enlace de abajo:";

                setStatus(
                    "success",
                    `Código detectado:<br>
                    <span class="code-badge">${escapeHtml(cleanCode)}</span>
                    <span class="subtext">${helperMsg}</span>`
                );

                const manualLink = connector
                    ? connector.createManualLinkElement(cleanCode)
                    : createFallbackLink(result.url);

                if (manualLink) {
                    statusBox.appendChild(manualLink);
                }

                addActionButton("Escanear otro código", () => {
                    isProcessing = false;
                    startScanner();
                });
            }

            function createFallbackLink(url) {
                const a = document.createElement("a");
                a.href = url;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.className = "manual-link";
                a.textContent = "Abrir búsqueda en Craftex";
                return a;
            }

            function onScanFailure() {
                // Normal mientras no haya un código enfocado dentro del cuadro
            }

            async function startScanner() {
                setStatus("idle", "Iniciando cámara...");

                if (!window.isSecureContext) {
                    setStatus(
                        "error",
                        "La cámara requiere HTTPS o localhost.<span class=\"subtext\">Abre esta página desde una conexión segura (HTTPS).</span>"
                    );
                    addActionButton("Intentar de nuevo", () => {
                        isProcessing = false;
                        startScanner();
                    });
                    return;
                }

                try {
                    await html5QrCode.start(
                        { facingMode: "environment" },
                        config,
                        onScanSuccess,
                        onScanFailure
                    );
                    setStatus("idle", "Apunta la cámara trasera al código de barras...");
                } catch (err) {
                    console.error("Error de cámara:", err);
                    setStatus(
                        "error",
                        "No se pudo acceder a la cámara.<span class=\"subtext\">Verifica los permisos del navegador o que ninguna otra app la esté usando.</span>"
                    );
                    addActionButton("Reintentar cámara", () => {
                        isProcessing = false;
                        startScanner();
                    });
                }
            }

            function escapeHtml(str) {
                return str
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            window.addEventListener("beforeunload", () => {
                if (html5QrCode.isScanning) {
                    html5QrCode.stop().catch(() => {});
                }
            });

            startScanner();
        });
    </script>
</body>
</html>
